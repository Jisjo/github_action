name: 04 - flask CI Workflow

on:
  workflow_dispatch:


jobs:
  flask-ci-job-demo-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOCKEN }}

      
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ProjectFiles/
          push: true
          tags: jisjo/cwvj-flask:v1.0.1

      - name: Run Container
        run: docker run -d -p 5000:5000 --name cwvj-flask-container jisjo/cwvj-flask:v1.0.1

      - name: Smoke Test
        run: |
          sleep 5
          curl http://localhost:5000/